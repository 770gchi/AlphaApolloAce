preprocess:
  - module: benchmarks.task_c.build
    args:
      output-dir: ./data/task_c
      model: Qwen/Qwen2.5-3B-Instruct

runner:
  launcher: python
  module: alphaapollo.core.generation.verl.trainer.main_generation
  overrides:
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=1
    - data.path=./data/task_c/test.parquet
    - data.prompt_key=prompt
    - data.n_samples=1
    - data.batch_size=5
    - data.dataloader_num_workers=0
    - data.return_raw_chat=true
    - data.truncation=right
    - data.output_path=./outputs/task_c/raw/elastic_llm_4k.parquet
    - data.save2json=true
    - data.json_output_path=./outputs/task_c/raw/elastic_llm_4k.jsonl
    - model.path=Qwen/Qwen2.5-3B-Instruct
    - rollout.name=vllm
    - rollout.do_sample=false
    - rollout.temperature=0.0
    - rollout.top_k=-1
    - rollout.top_p=1.0
    - rollout.prompt_length=4096
    - rollout.response_length=512
    - rollout.max_model_len=32768
    - rollout.tensor_model_parallel_size=1
    - rollout.gpu_memory_utilization=0.75
    - rollout.max_num_batched_tokens=8192
    - rollout.enable_chunked_prefill=false
    - context_policy.mode=elastic
    - context_policy.max_input_tokens=4096
    - context_policy.reserve_output_tokens=512
    - context_policy.model_context_window=32768
    - context_policy.keep_last_raw=true
    - context_policy.abstraction_cache=true
    - context_policy.orchestration=llm
    - context_policy.truncate_window_steps=4
    - context_policy.abstraction_max_tokens=256
    - context_policy.orchestration_max_tokens=512
    - context_policy.allowed_types=[raw,abstract,drop]
    - context_policy.audit_dir=./outputs/task_c/audit/elastic_llm_4k
    - context_policy.store_dir=./outputs/task_c/store/elastic_llm_4k
    - env.env_name=delayed_evidence
    - env.seed=0
    - env.max_steps=17
    - env.history_length=16
    - env.resources_per_worker.num_cpus=0.1
